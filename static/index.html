<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Agent — 几何智能解题</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>📐 Geometry Agent</h1>
    <p class="subtitle">中文几何题智能解题系统 · 初中 / 高中 / 竞赛</p>
  </header>

  <main>
    <!-- ============ 输入区 ============ -->
    <section class="card">
      <h2>题目输入</h2>

      <div class="mode-tabs">
        <button id="tab-single" class="tab active" onclick="switchMode('single')">单题</button>
        <button id="tab-multi" class="tab" onclick="switchMode('multi')">多小题</button>
      </div>

      <div class="field">
        <label for="problem">题干</label>
        <textarea id="problem" rows="4" placeholder="例如：设椭圆 Γ: x²/4 + y²/3 = 1，过内部点 A(1,1) 作斜率之和为 1 的直线 MN 和 PQ，分别交椭圆于 M,N 和 P,Q。MN 中点为 B，PQ 中点为 C，证明：直线 BC 过定点。"></textarea>
      </div>

      <div id="sub-questions" class="hidden">
        <label>各小题（每行一题）</label>
        <div id="sub-list">
          <input type="text" class="sub-input" placeholder="(1) 求 E 的方程" />
        </div>
        <button class="btn-small" onclick="addSub()">+ 添加小题</button>
      </div>

      <div class="row">
        <div class="field">
          <label for="grade">学段</label>
          <select id="grade">
            <option value="junior">初中</option>
            <option value="senior" selected>高中</option>
            <option value="competition">竞赛</option>
          </select>
        </div>
        <div class="field">
          <label for="max-calls">最大推理步数</label>
          <input type="number" id="max-calls" value="60" min="10" max="120" />
        </div>
      </div>

      <button id="solve-btn" class="btn-primary" onclick="solve()">
        <span id="solve-text">开始求解</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>
    </section>

    <!-- ============ 结果区 ============ -->
    <section id="result" class="card hidden">
      <h2>解答结果</h2>

      <div id="status-bar" class="status-bar"></div>

      <div id="parts"></div>

      <div id="pdf-link-wrap" class="hidden">
        <a id="pdf-link" class="btn-primary" target="_blank">📄 下载 PDF 报告</a>
      </div>
    </section>

    <!-- ============ 错误区 ============ -->
    <section id="error" class="card error hidden"></section>
  </main>

  <footer>
    <p>Geometry Agent v0.1.0 · 神经-符号混合推理 · <a href="https://github.com/haitanghuaweimianTom/geometry-agent" target="_blank">GitHub</a></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
