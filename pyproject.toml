[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-agent"
version = "0.1.0"
description = "Geometry Agent: neuro-symbolic system for solving Chinese Zhongkao/Gaokao geometry problems"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "networkx>=3.0",
    "sympy>=1.12",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "Pillow>=10.0",
    "pyz3>=0.2",
    "lark>=1.1",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "requests>=2.31",
    "structlog>=23.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
sam = ["segment-anything"]
yolo = ["ultralytics"]
ocr = ["paddleocr"]
llm = ["openai>=1.0", "anthropic>=0.18"]
dev = ["pytest>=7.4", "pytest-cov", "ruff", "mypy"]

[project.scripts]
geometry-agent = "geometry_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
