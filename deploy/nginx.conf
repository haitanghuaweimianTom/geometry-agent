# nginx reverse proxy for Geometry Agent
# Place at: /etc/nginx/sites-available/geometry-agent
#
# Rate limiting: 10 req/min per IP for /api/solve, 30 req/min for other endpoints.
# TLS: uncomment the ssl_* lines after running certbot.

limit_req_zone $binary_remote_addr zone=solve_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_status 429;

upstream geometry_agent {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen __PORT__;
    server_name _;

    client_max_body_size 10m;
    client_body_timeout 120s;
    proxy_read_timeout 180s;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    location /style.css   { alias /opt/geometry-agent/static/style.css; expires 1d; }
    location /app.js      { alias /opt/geometry-agent/static/app.js;   expires 1d; }

    location /api/pdf/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://geometry_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://geometry_agent;
        proxy_set_header Host $host;
    }

    location /api/solve/stream {
        limit_req zone=solve_limit burst=3 nodelay;
        proxy_pass http://geometry_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://geometry_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://geometry_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
